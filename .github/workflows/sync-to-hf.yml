name: Verify and deploy Prefero

on:
  push:
    branches: [main, release/empirical-prototype]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prefero-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Check public source tree
        run: python .github/scripts/check-public-tree.py
      - name: Install the same runtime as Docker
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
          python -m pip install 'pytest>=8,<9'
          python -m pip check
          python -c 'import dce_analyzer'
      - name: Check that the app and library compile
        run: python -m compileall -q app src
      - name: Run regression and compatibility tests
        env:
          PREFERO_DB_PATH: ${{ runner.temp }}/prefero-ci.db
        run: |
          python -m pytest tests -q
          python scripts/test_e2e.py
          python scripts/test_cv.py
          python scripts/test_new_modules.py
      - name: Build the application image
        run: docker build -t prefero:${{ github.sha }} .
      - name: Check the container and application startup
        run: |
          docker run -d --name prefero-check -p 127.0.0.1:7860:7860 prefero:${{ github.sha }}
          timeout 60 bash -c 'until curl --fail --silent http://localhost:7860/_stcore/health; do sleep 2; done'
          docker exec -e PYTHONPATH=/app/app prefero-check python -c 'from streamlit.testing.v1 import AppTest; app = AppTest.from_file("app/Home.py", default_timeout=30).run(); assert not app.exception, app.exception'
      - name: Stop test container
        if: always()
        run: |
          docker logs prefero-check || true
          docker rm -f prefero-check || true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve current HF revision and deploy a fast-forward update
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::The HF_TOKEN repository secret is required to deploy."
            exit 1
          fi
          export GIT_ASKPASS="$RUNNER_TEMP/hf-askpass"
          export GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'Wil2200' ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          git remote add hf https://huggingface.co/spaces/Wil2200/prefero
          git fetch --no-tags hf refs/heads/main
          previous=$(git rev-parse FETCH_HEAD)
          if [[ "$previous" == "$GITHUB_SHA" ]]; then
            printf 'Hugging Face already has %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$previous" "$GITHUB_SHA"; then
            echo "::error::Hugging Face main diverged. Reconcile its changes in a reviewed PR and rerun."
            exit 1
          fi
          git push hf "$previous:refs/heads/releases/pre-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push hf "$GITHUB_SHA:refs/heads/main"
          printf 'Deployed %s; previous HF revision %s\n' "$GITHUB_SHA" "$previous" >> "$GITHUB_STEP_SUMMARY"
